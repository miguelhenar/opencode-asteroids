name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Requerido para el intercambio de autenticación segura
      contents: write      # Permite al bot leer y escribir código si genera un parche
      pull-requests: write # Permite interactuar y responder en Pull Requests
      issues: write        # Permite leer y responder comentarios en los Issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Modelo gratuito del catálogo público nativo libre de restricciones geográficas
          model: opencode/anthropic/claude-sonnet-4-20250514
          use_github_token: true