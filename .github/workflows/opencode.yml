name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write      
      contents: write      
      pull-requests: write 
      issues: write        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Forzamos a que tanto el agente principal como los sub-agentes usen la pasarela correcta
          OPENCODE_MODEL: "opencode-go/muse-spark-1.2-contributor"
          OPENCODE_ALLOW_DATA_TRAINING: "true"
        with:
          # Especificamos el modelo de la pasarela libre
          model: opencode-go/muse-spark-1.2-contributor
          use_github_token: true
