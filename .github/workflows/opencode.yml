name: opencode
on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      
      contents: write      
      pull-requests: write 
      issues: write        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # SOLUCIÓN CLAVE: Pasamos tu clave personal en lugar del token del servidor
          GITHUB_TOKEN: ${{ secrets.OPENCODE_API_KEY }} 
          OPENCODE_VERSION: "1.18.32"
        with:
          # Usamos el identificador exacto que te sugiere el servidor
          model: github-copilot/gpt-5.4-nano
          use_github_token: false
