name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Requerido para el intercambio OIDC
      contents: write      # Permite a OpenCode leer y escribir código si es necesario
      pull-requests: write # Permite interactuar con los PRs
      issues: write        # Permite responder y leer issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <- OBLIGATORIO: GitHub lo provee solo
           # Forzamos la aceptación de la política de entrenamiento de datos que exige el modelo
          OPENCODE_ALLOW_DATA_TRAINING: "true"
        with:
          model: opencode/muse-spark-1.2
          use_github_token: true # <- ACTIVA ESTA OPCIÓN